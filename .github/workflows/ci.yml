name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build UIKit and SwiftUI examples
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install mise
        uses: jdx/mise-action@v3

      - name: Install contract check dependencies
        run: brew install ripgrep

      - name: Build applications
        env:
          GH_TOKEN: ${{ secrets.XC_EASY_INTEGRATION_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          ./scripts/check-ci.sh
