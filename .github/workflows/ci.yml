name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify UIKit and SwiftUI examples
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out examples
        uses: actions/checkout@v5
        with:
          path: xceasy-examples

      - name: Check out XCEasy
        uses: actions/checkout@v5
        with:
          repository: qa-point/xceasy
          token: ${{ secrets.XC_EASY_INTEGRATION_TOKEN }}
          path: xceasy

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          working_directory: xceasy-examples

      - name: Run complete example suite
        working-directory: xceasy-examples
        env:
          TUIST_XCEASY_USE_LOCAL_PACKAGE: "1"
        run: ./scripts/check-all.sh

      - name: Upload combined Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: xceasy-examples/allure-results
          if-no-files-found: warn
